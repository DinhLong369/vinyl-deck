root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/vinyl-api ."
  entrypoint = ["./tmp/vinyl-api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "data", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
